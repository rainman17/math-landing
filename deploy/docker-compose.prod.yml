# Production / staging на одном VPS: приложение + PostgreSQL + Caddy (HTTPS от Let's Encrypt).
# Запуск из каталога deploy/:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Персональные данные граждан РФ должны храниться на серверах в РФ (152-ФЗ) — выбирайте хостинг соответственно.
name: mkm

services:
  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
