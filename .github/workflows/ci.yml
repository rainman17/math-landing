name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Сборка без базы данных
        run: npm run build
        env:
          DATABASE_URL: postgres://none:none@127.0.0.1:1/none
          PAYLOAD_SECRET: ci-build-secret

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mkm
          POSTGRES_PASSWORD: mkm
          POSTGRES_DB: mkm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mkm -d mkm" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://mkm:mkm@127.0.0.1:5432/mkm
      PAYLOAD_SECRET: ci-e2e-secret
      SITE_URL: http://localhost:3000
      JOBS_AUTORUN: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run seed
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
